<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Azure UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent:      #0084ff;
  --accent-lit:  #6ec8ff;
  --accent-deep: #0048a0;
  --ink:         #e7edf5;
  --ink-dim:     #8491a5;
  --row-h:       44px;
  --panel-w:     420px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  cursor: default;
}

/* ============================ PANEL ============================ */

#panel {
  position: absolute;
  left: 7%; top: 10%;
  width: var(--panel-w);
  border-radius: 10px;
  overflow: hidden;
  /* Flat transparency only. No backdrop-filter (CEF renders it as a black
     box) and no glow - just a see-through dark tint like a real menu. */
  background: rgba(6, 9, 14, 0.55);
  border: 1px solid rgba(0, 132, 255, 0.30);
  opacity: 0;
  transform: translateY(-10px) scale(0.985);
  transition: opacity .18s ease, transform .18s cubic-bezier(.2,.8,.25,1);
  pointer-events: none;
}
#panel.on { opacity: 1; transform: none; }

/* ============================ BANNER =========================== */

#banner {
  position: relative;
  height: 104px;
  overflow: hidden;
  background: #0a0d14 center / cover no-repeat;   /* image set by JS */
}

/* Wordmark shown only when there is no banner image. Flat, no glow. */
#wordmark {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 10px;
  text-indent: 10px;
  color: #fff;
}
#banner.has-img #wordmark { display: none; }

/* thin flat accent line under the banner */
#banner .edge {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: var(--accent);
}

/* Built-in blue "Azure" banner - drawn entirely in CSS/SVG so it needs no
   network image (remote banners are blocked by the CEF CSP). Selected via the
   Banner picker value "azure". */
#banner.azure {
  background:
    linear-gradient(135deg, rgba(255,255,255,.06) 0 25%, transparent 25% 50%, rgba(255,255,255,.05) 50% 75%, transparent 75%),
    linear-gradient(45deg,  rgba(0,0,0,.10) 0 20%, transparent 20% 55%, rgba(0,0,0,.12) 55% 80%, transparent 80%),
    radial-gradient(130% 150% at 50% 32%, #1e73f7 0%, #0b52d9 48%, #063aa8 100%);
}
#banner.azure .edge { background: var(--accent-lit); }
#banner.azure #wordmark { display: none; }

#azlogo {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center; gap: 14px;
}
#banner.azure #azlogo { display: flex; }
#azlogo svg { width: 48px; height: 48px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
#azlogo .txt { display: flex; flex-direction: column; line-height: 1.02; }
#azlogo .txt b {
  color: #fff; font-weight: 800; font-size: 26px; letter-spacing: 2px;
  text-shadow: 0 1px 6px rgba(0,0,0,.35);
}
#azlogo .txt span {
  color: rgba(255,255,255,.82); font-weight: 500; font-size: 14px; letter-spacing: 3px;
}

/* ============================ CRUMB ============================ */

#crumb {
  display: flex; align-items: center;
  height: 34px; padding: 0 14px;
  background: rgba(3, 5, 9, .85);
  border-bottom: 1px solid rgba(0,132,255,.14);
  font-size: 12px;
}
#path { color: var(--ink); letter-spacing: .3px; }
#path .sep { color: var(--ink-dim); margin: 0 6px; }
#path .root { color: var(--ink-dim); }
#count { margin-left: auto; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

/* ============================ TABS ============================= */

#tabs { display: none; gap: 6px; padding: 8px 12px 2px; }
#tabs.on { display: flex; }
#tabs .tab {
  flex: 1; text-align: center;
  padding: 6px 0;
  font-size: 11px; letter-spacing: .4px; text-transform: uppercase;
  color: var(--ink-dim);
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 5px;
  transition: all .15s ease;
}
#tabs .tab.sel {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
}

/* ============================ LIST ============================= */

#viewport {
  position: relative;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
}

/* sliding selection block - flat solid accent, no glow */
#cursor {
  position: absolute; left: 0; right: 0;
  height: var(--row-h);
  background: var(--accent);
  transition: transform .14s ease;
  will-change: transform;
}

#list { transition: transform .16s cubic-bezier(.2,.9,.25,1); }

.row {
  position: relative;
  display: flex; align-items: center;
  height: var(--row-h);
  padding: 0 14px;
  font-size: 14px;
  color: var(--ink);
  border-bottom: 1px solid rgba(255,255,255,.025);
  animation: rowIn .22s ease backwards;
}
@keyframes rowIn { from { opacity: 0; transform: translateX(-10px); } }

.row.sel   { color: #fff; font-weight: 600; }
.row.dim   { color: #5d6577; }
.row.divider {
  height: 26px; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--ink-dim); background: rgba(255,255,255,.02);
  border-bottom: 1px solid rgba(0,132,255,.12);
}

.row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val   { color: var(--ink-dim); font-size: 13px; margin-left: 10px; }
.row.sel .val { color: rgba(255,255,255,.92); }
.row .val .arw { opacity: .45; padding: 0 4px; }
.row .chev  { color: #55637a; font-size: 15px; }
.row.sel .chev { color: #fff; }

/* toggle pill */
.pill {
  width: 34px; height: 17px; border-radius: 9px;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.10);
  position: relative;
  transition: all .18s ease;
}
.pill i {
  position: absolute; top: 2px; left: 2px;
  width: 11px; height: 11px; border-radius: 50%;
  background: #7d8899;
  transition: all .18s cubic-bezier(.2,.9,.25,1);
}
.pill.on {
  background: rgba(0,132,255,.45);
  border-color: rgba(120,205,255,.65);
}
.pill.on i { left: 18px; background: var(--accent-lit); }
.row.sel .pill.on { background: rgba(255,255,255,.28); }
.row.sel .pill.on i { background: #fff; }

/* ============================ DESC + FOOT ====================== */

#desc {
  padding: 9px 14px;
  font-size: 11.5px; line-height: 1.35;
  color: var(--ink-dim);
  background: rgba(3,5,9,.72);
  border-top: 1px solid rgba(0,132,255,.14);
  border-left: 3px solid var(--accent-deep);
  min-height: 32px;
}
#desc.empty { display: none; }

#foot {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px; height: 30px;
  background: rgba(2,4,8,.92);
  border-top: 1px solid rgba(0,132,255,.22);
  font-size: 10.5px; color: var(--ink-dim); letter-spacing: .4px;
}
#foot .mark {
  font-weight: 800; font-size: 13px; color: var(--accent-lit);
}
#foot .keys { margin-left: auto; color: var(--accent-lit); }

/* bind chip on a feature row */
.row .bindchip {
  margin-left: 8px; padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 600; letter-spacing: .3px;
  color: var(--accent-lit);
  background: rgba(0,132,255,.14);
  border: 1px solid rgba(0,132,255,.4);
}
.row.sel .bindchip { color: #fff; border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.18); }
.row .bindchip.listening {
  color: #fff; background: var(--accent); border-color: var(--accent);
  animation: talkpulse .8s ease-in-out infinite;
}

/* ==================== ACTIVE KEYBINDS (top-right) ============= */

#binds {
  position: absolute; left: 24px; top: 24px;
  width: 190px; border-radius: 8px; overflow: hidden;
  background: rgba(6,9,14,.82);
  border: 1px solid rgba(0,132,255,.28);
  font-size: 12px;
}
#binds.empty { display: none; }
#binds .head {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  background: rgba(0,132,255,.16);
  color: #fff; font-weight: 700; font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
}
#binds .brow {
  display: flex; align-items: center;
  padding: 6px 11px;
  border-top: 1px solid rgba(255,255,255,.05);
  color: var(--ink);
}
#binds .brow .k {
  margin-left: auto; color: var(--ink-dim); font-weight: 600;
}
#binds .brow .st { margin-left: 8px; font-size: 10px; font-weight: 700; }
#binds .brow .st.on  { color: #29d18c; }
#binds .brow .st.off { color: #ff6470; }

/* ============================ ESP ============================= */

#esp, #aimcvs {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ============ SERVER STATS (simple white line) ============ */
#serverstats {
  position: fixed; left: 32%; top: 14px; transform: translateX(-50%);
  font-family: "Inter", system-ui, sans-serif;
  font-size: 15px; font-weight: 500; color: #fff;
  letter-spacing: .3px; white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
}
#serverstats.empty { display: none; }
#serverstats .sep { color: var(--accent-lit); margin: 0 8px; opacity: .8; }

/* ============ SPECTATOR ALERT PANEL ============ */
#spectators {
  position: fixed; left: 50%; top: 70px; transform: translateX(-50%);
  width: 210px; border-radius: 8px; overflow: hidden;
  background: rgba(20,6,6,.86);
  border: 1px solid rgba(255,77,94,.4);
  font-size: 12px;
}
#spectators.empty { display: none; }
#spectators .head {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  background: rgba(255,77,94,.18);
  color: #fff; font-weight: 700; font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
}
#spectators .srow {
  display: flex; align-items: center;
  padding: 6px 11px;
  border-top: 1px solid rgba(255,255,255,.05);
  color: #ffd7db;
}
#spectators .srow .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #ff4d5e; margin-right: 8px; flex: none;
  animation: talkpulse 1s ease-in-out infinite;
}

/* ============================ FREECAM ========================= */

#freecam { position: fixed; inset: 0; pointer-events: none; }
#freecam.off { display: none; }

/* simple white dot crosshair */
#fc-crosshair {
  position: absolute; left: 50%; top: 50%;
  width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.85);
}

/* Centered feature scroller. The selected row sits at the anchor (a bit below
   screen centre) and the passed rows flow above/below it, fading and shrinking
   with distance - only ~3 each side are shown. Wrapping keeps it centred. */
.FCWrapper {
  position: absolute;
  left: 50%; top: 80%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 7px;
  font-family: "Inter", sans-serif;
  pointer-events: none;
}
.FCWrapper .Option {
  color: #fff; font-weight: 500; letter-spacing: .2px; white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
  transition: opacity .12s ease, transform .12s ease, font-size .12s ease;
}
.FCWrapper .Option.Selected { font-weight: 700; }
/* distance-from-centre tiers: further back = smaller + fainter */
.FCWrapper .d0 { font-size: 16px; opacity: 1;    transform: scale(1); }
.FCWrapper .d1 { font-size: 13px; opacity: .50;  transform: scale(.94); }
.FCWrapper .d2 { font-size: 12px; opacity: .26;  transform: scale(.88); }
.FCWrapper .d3 { font-size: 11px; opacity: .12;  transform: scale(.82); }

/* talk indicator (top-center, clear of the keybinds panel) */
#talkers {
  position: absolute; left: 50%; top: 24px; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.talker {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 7px;
  background: rgba(9,12,19,.9);
  border-left: 3px solid var(--accent);
  font-size: 12px; color: var(--ink);
  animation: toastIn .2s ease;
}
.talker.near { border-left-color: #29d18c; }
.talker .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-lit); flex: none;
  animation: talkpulse 1s ease-in-out infinite;
}
.talker.near .dot { background: #29d18c; }
@keyframes talkpulse { 50% { opacity: .35; } }

/* ============================ LOADER ========================== */

/* Minimal, sleek: a small centered bar + status text. No backdrop. */
#loader {
  position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 240px;
  pointer-events: none;
  transition: opacity .35s ease;
}
#loader.off { opacity: 0; }
#loader .lmark {
  font-size: 13px; font-weight: 700; letter-spacing: 5px; text-indent: 5px;
  color: #fff; text-align: center; margin-bottom: 12px;
  text-shadow: 0 1px 6px rgba(0,0,0,.8);
}
#loader .lbar {
  height: 3px; border-radius: 3px; overflow: hidden;
  background: rgba(255,255,255,.12);
}
#loader #lfill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent-lit));
  transition: width .25s ease;
}
#loader #ltext {
  margin-top: 9px; font-size: 11px; color: var(--ink-dim);
  letter-spacing: .3px; text-align: center; min-height: 14px;
  text-shadow: 0 1px 5px rgba(0,0,0,.8);
}

/* ============================ HEALTH HUD ====================== */

#healthhud {
  position: fixed; left: 24px; bottom: 24px;
  width: 190px; display: none;
}
#healthhud.on { display: block; }
#healthhud .hrow { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
#healthhud .hlabel {
  font-size: 10px; font-weight: 700; width: 16px; color: var(--ink-dim);
  text-shadow: 0 1px 4px rgba(0,0,0,.8);
}
#healthhud .htrack {
  flex: 1; height: 8px; border-radius: 4px; overflow: hidden;
  background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.10);
}
#healthhud .hfill { height: 100%; transition: width .2s ease, background .2s ease; }
#healthhud .hfill.armor { background: linear-gradient(90deg, #0084ff, #6ec8ff); }

/* ============================ TOASTS =========================== */

#toasts {
  position: absolute; top: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 8px;
  width: 300px;
}
.toast {
  padding: 11px 14px;
  border-radius: 8px;
  background: rgba(9,12,19,.96);
  border: 1px solid rgba(255,255,255,.06);
  border-left: 3px solid var(--accent);
  animation: toastIn .25s cubic-bezier(.2,.9,.25,1);
}
.toast.out { animation: toastOut .25s ease forwards; }
.toast.error   { border-left-color: #ff4d5e; }
.toast.success { border-left-color: #29d18c; }
.toast .t { font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .4px; }
.toast .d { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
@keyframes toastIn  { from { opacity: 0; transform: translateX(40px); } }
@keyframes toastOut { to   { opacity: 0; transform: translateX(40px); } }
</style>
</head>
<body>

<canvas id="esp"></canvas>
<canvas id="aimcvs"></canvas>
<div id="serverstats" class="empty"></div>
<div id="spectators" class="empty"></div>

<div id="loader">
  <div class="lwrap">
    <div class="lmark">AZURE</div>
    <div class="lbar"><div id="lfill"></div></div>
    <div id="ltext">Loading...</div>
  </div>
</div>

<div id="binds" class="empty"></div>

<div id="panel">
  <div id="banner">
    <div id="wordmark">AZURE</div>
    <div id="azlogo">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <polygon points="24,7 41,41 7,41" fill="#ffffff"></polygon>
        <polygon points="24,7 31,41 17,41" fill="#0b52d9"></polygon>
      </svg>
      <div class="txt"><b>AZURE</b><span>MENU</span></div>
    </div>
    <div class="edge"></div>
  </div>

  <div id="crumb">
    <div id="path"></div>
    <div id="count"></div>
  </div>

  <div id="tabs"></div>

  <div id="viewport">
    <div id="cursor"></div>
    <div id="list"></div>
  </div>

  <div id="desc" class="empty"></div>

  <div id="foot">
    <span class="mark">A</span>
    <span id="meta"></span>
    <span class="keys" id="keys"></span>
  </div>
</div>

<div id="toasts"></div>

<div id="freecam" class="off">
  <div id="fc-crosshair"></div>
  <div id="fc-options" class="FCWrapper"></div>
</div>

<div id="talkers"></div>

<div id="healthhud">
  <div class="hrow"><span class="hlabel">HP</span><div class="htrack"><div class="hfill" id="hp-fill"></div></div></div>
  <div class="hrow"><span class="hlabel">AR</span><div class="htrack"><div class="hfill armor" id="ar-fill"></div></div></div>
</div>

<script>
var ROW = 44;

var S = {
  elements: [],
  index: 0,
  scrollPx: 0,
  maxVisible: 10,
  version: "1.0.0",
  keys: "F5 / F7",
  bootedAt: Date.now()
};

var $panel  = document.getElementById("panel");
var $list   = document.getElementById("list");
var $cursor = document.getElementById("cursor");
var $view   = document.getElementById("viewport");
var $path   = document.getElementById("path");
var $count  = document.getElementById("count");
var $desc   = document.getElementById("desc");
var $tabs   = document.getElementById("tabs");
var $meta   = document.getElementById("meta");
var $keys   = document.getElementById("keys");
var $wm     = document.getElementById("wordmark");
var $banner = document.getElementById("banner");
var $freecam = document.getElementById("freecam");
var $fcopts  = document.getElementById("fc-options");
var $fccross = document.getElementById("fc-crosshair");
var $talkers = document.getElementById("talkers");
var $binds   = document.getElementById("binds");
var $esp     = document.getElementById("esp");
var ectx     = $esp.getContext("2d");
var $loader  = document.getElementById("loader");
var $lfill   = document.getElementById("lfill");
var $ltext   = document.getElementById("ltext");
var $hud     = document.getElementById("healthhud");
var $hpFill  = document.getElementById("hp-fill");
var $arFill  = document.getElementById("ar-fill");
var $aim     = document.getElementById("aimcvs");
var actx     = $aim.getContext("2d");
var $sstats  = document.getElementById("serverstats");
var $spec    = document.getElementById("spectators");

function setHealth(d) {
  if (d.hide) { $hud.classList.remove("on"); return; }
  var hp = Math.max(0, Math.min(100, d.hp || 0));
  var ar = Math.max(0, Math.min(100, d.armor || 0));
  $hpFill.style.width = hp + "%";
  $arFill.style.width = ar + "%";
  $hpFill.style.background = hp > 50
    ? "linear-gradient(90deg,#29d18c,#7be0b0)"
    : (hp > 25 ? "linear-gradient(90deg,#e0b020,#f0d060)"
               : "linear-gradient(90deg,#ff4d5e,#ff8a8a)");
  $hud.classList.add("on");
}

function sizeEsp() {
  $esp.width = window.innerWidth; $esp.height = window.innerHeight;
  $aim.width = window.innerWidth; $aim.height = window.innerHeight;
}
window.addEventListener("resize", sizeEsp);
sizeEsp();

/* ---------- silent-aim FOV circle + lock line ---------- */
function drawAim(d) {
  actx.clearRect(0, 0, $aim.width, $aim.height);
  if (d.hide) return;
  var W = $aim.width, H = $aim.height, cx = W / 2, cy = H / 2;
  // FOV circle
  actx.beginPath();
  actx.arc(cx, cy, d.fov || 140, 0, Math.PI * 2);
  actx.strokeStyle = "rgba(0,132,255,.55)"; actx.lineWidth = 1.5;
  actx.stroke();
  // line to locked target
  if (d.tx !== undefined && d.tx !== null) {
    var tx = d.tx * W, ty = d.ty * H;
    actx.beginPath(); actx.moveTo(cx, cy); actx.lineTo(tx, ty);
    actx.strokeStyle = "#ff4d5e"; actx.lineWidth = 1.5; actx.stroke();
    actx.beginPath(); actx.arc(tx, ty, 4, 0, Math.PI * 2);
    actx.fillStyle = "#ff4d5e"; actx.fill();
  }
}

/* ---------- server stats line ---------- */
function setServerStats(d) {
  if (d.hide) { $sstats.classList.add("empty"); return; }
  var parts = [];
  if (d.name && d.name.length) parts.push(esc(d.name));
  if (d.ip && d.ip.length)     parts.push(esc(d.ip));
  parts.push((d.players || 0) + " players");
  $sstats.innerHTML = parts.join('<span class="sep">|</span>');
  $sstats.classList.remove("empty");
}

/* ---------- spectator alert panel ---------- */
function setSpectators(list) {
  if (!list || !list.length) { $spec.classList.add("empty"); $spec.innerHTML = ""; return; }
  var h = '<div class="head">&#9888; Being Spectated</div>';
  for (var i = 0; i < list.length; i++) {
    h += '<div class="srow"><span class="dot"></span>' + esc(list[i]) + "</div>";
  }
  $spec.innerHTML = h;
  $spec.classList.remove("empty");
}

/* ---------- active keybinds panel (top-right) ---------- */
function setBinds(list, visible) {
  if (visible === false || !list || !list.length) { $binds.classList.add("empty"); $binds.innerHTML = ""; return; }
  var h = '<div class="head">Keybinds</div>';
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var st = "";
    if (b.state) st = '<span class="st ' + (b.state === "ON" ? "on" : "off") + '">' + b.state + "</span>";
    h += '<div class="brow"><span>' + esc(b.label) + '</span>' +
         '<span class="k">' + esc(b.key) + "</span>" + st + "</div>";
  }
  $binds.innerHTML = h;
  $binds.classList.remove("empty");
}

/* ---------- ESP canvas ---------- */
function espText(t, x, y) {
  ectx.lineWidth = 3; ectx.strokeStyle = "rgba(0,0,0,.85)";
  ectx.strokeText(t, x, y);
  ectx.fillText(t, x, y);
}
function drawEsp(players, flags) {
  ectx.clearRect(0, 0, $esp.width, $esp.height);
  if (!players || !players.length) return;
  var W = $esp.width, H = $esp.height;
  ectx.textAlign = "center";

  for (var i = 0; i < players.length; i++) {
    var p  = players[i];
    var x  = p.x * W, y = p.y * H, w = p.w * W, h = p.h * H;
    var cx = p.fx * W, fy = p.fy * H;

    if (flags.lines) {
      ectx.strokeStyle = "rgba(0,132,255,.55)"; ectx.lineWidth = 1;
      ectx.beginPath(); ectx.moveTo(W / 2, H); ectx.lineTo(cx, fy); ectx.stroke();
    }
    if (flags.skeleton && p.bones) {
      ectx.strokeStyle = "rgba(255,255,255,.85)"; ectx.lineWidth = 1.3;
      for (var b = 0; b < p.bones.length; b++) {
        var s = p.bones[b];
        ectx.beginPath(); ectx.moveTo(s[0] * W, s[1] * H); ectx.lineTo(s[2] * W, s[3] * H); ectx.stroke();
      }
    }
    if ((flags.box && !p.npc) || (flags.npc && p.npc)) {
      ectx.lineWidth = 3; ectx.strokeStyle = "rgba(0,0,0,.6)"; ectx.strokeRect(x, y, w, h);
      ectx.lineWidth = 1.4; ectx.strokeStyle = p.npc ? "#e0b020" : "#0084ff"; ectx.strokeRect(x, y, w, h);
    }
    if (flags.health && p.hp !== undefined && p.hp !== null) {
      var bw = 3, bx = x - bw - 3;               // just left of the box
      var fillH = h * (p.hp / 100);
      ectx.fillStyle = "rgba(0,0,0,.6)";          // background track
      ectx.fillRect(bx - 1, y - 1, bw + 2, h + 2);
      ectx.fillStyle = p.hp > 50 ? "#29d18c" : (p.hp > 25 ? "#e0b020" : "#ff4d5e");
      ectx.fillRect(bx, y + (h - fillH), bw, fillH);   // fills bottom-up
    }
    if (flags.names) {
      ectx.font = "600 12px Inter, sans-serif"; ectx.fillStyle = "#fff";
      espText(p.name, cx, y - 5);
    }
    if (p.admin) {
      ectx.font = "700 11px Inter, sans-serif"; ectx.fillStyle = "#ffb020";
      espText("ADMIN", cx, y - (flags.names ? 19 : 5));
    }
    if (flags.distance) {
      ectx.font = "11px Inter, sans-serif"; ectx.fillStyle = "rgba(180,212,255,.95)";
      espText(p.dist + "m", cx, fy + 13);
    }
  }
}

function fcShow(on)   { $freecam.classList.toggle("off", !on); }
function fcOptions(list, idx) {
  list = list || [];
  var n = list.length;
  if (!n) { $fcopts.innerHTML = ""; return; }
  // Show up to 3 rows each side of the selected one, wrapping the index so the
  // selected row is always centred. Clamp the window on short lists so nothing
  // gets shown twice.
  var win = Math.min(3, Math.floor((n - 1) / 2));
  var h = "";
  for (var off = -win; off <= win; off++) {
    var i = ((idx + off) % n + n) % n;
    var dist = Math.abs(off);
    var cls = "Option d" + dist + (off === 0 ? " Selected" : "");
    h += '<div class="' + cls + '">' + esc(list[i]) + "</div>";
  }
  $fcopts.innerHTML = h;
}
function setTalkers(list) {
  if (!list || !list.length) { $talkers.innerHTML = ""; return; }
  var h = "";
  for (var i = 0; i < list.length; i++) {
    var t = list[i];
    var name = (t && t.name !== undefined) ? t.name : t;
    var near = t && t.near;
    var tail = near ? " (near you)" : "";
    h += '<div class="talker' + (near ? " near" : "") + '"><span class="dot"></span>' +
         esc(name) + " talking" + tail + "</div>";
  }
  $talkers.innerHTML = h;
}

function applyBanner(url) {
  $banner.classList.remove("azure");
  // "azure" = the built-in CSS/SVG banner (no network image needed).
  if (url === "azure") {
    $banner.style.backgroundImage = "";
    $banner.classList.remove("has-img");
    $banner.classList.add("azure");
    return;
  }
  if (url && url.length) {
    $banner.style.backgroundImage = "url('" + url.replace(/'/g, "%27") + "')";
    $banner.classList.add("has-img");
  } else {
    $banner.style.backgroundImage = "";
    $banner.classList.remove("has-img");
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ---------- value rendering per item type ---------- */
function rightSide(el) {
  var t = el.type;
  if (t === "checkbox" || t === "toggle") {
    return '<div class="pill' + (el.checked ? " on" : "") + '"><i></i></div>';
  }
  if (t === "subMenu" || t === "submenu") {
    return '<div class="chev">&#8250;</div>';
  }
  if (el.value !== undefined && el.value !== null && el.value !== "") {
    if (t === "list" || t === "scrollable" || t === "slider") {
      return '<div class="val"><span class="arw">&#8249;</span>' + esc(el.value) +
             '<span class="arw">&#8250;</span></div>';
    }
    return '<div class="val">' + esc(el.value) + "</div>";
  }
  return "";
}

function buildRows() {
  var html = "";
  for (var i = 0; i < S.elements.length; i++) {
    var el = S.elements[i];
    if (el.type === "divider") {
      html += '<div class="row divider" style="animation-delay:' + (i * 12) + 'ms">' +
              '<div class="label">' + esc(el.label) + "</div></div>";
      continue;
    }
    var cls = "row" + (el.disabled || el.type === "label" ? " dim" : "");
    var bind = "";
    if (el.binding)   bind = '<span class="bindchip listening">press key</span>';
    else if (el.bind) bind = '<span class="bindchip">' + esc(el.bind) + "</span>";
    html += '<div class="' + cls + '" style="animation-delay:' + (i * 12) + 'ms">' +
            '<div class="label">' + esc(el.label) + "</div>" +
            bind + rightSide(el) + "</div>";
  }
  $list.innerHTML = html;

  // Viewport height = actual height of the first N rows (dividers are shorter
  // than options, so counting rows x ROW would be wrong).
  var n = Math.min(S.elements.length || 1, S.maxVisible);
  var h = 0;
  for (var k = 0; k < n && k < $list.children.length; k++) {
    h += $list.children[k].offsetHeight;
  }
  $view.style.height = (h || ROW) + "px";
}

function paint() {
  var rows = $list.children;
  for (var i = 0; i < rows.length; i++) {
    if (i === S.index) rows[i].classList.add("sel");
    else rows[i].classList.remove("sel");
  }

  var sel = rows[S.index];
  if (!sel) { $cursor.style.display = "none"; }
  else {
    // Scroll (in real pixels) so the selected row stays inside the viewport.
    var viewH = $view.clientHeight;
    var top   = sel.offsetTop;
    var bot   = top + sel.offsetHeight;
    if (top < S.scrollPx)          S.scrollPx = top;
    if (bot > S.scrollPx + viewH)  S.scrollPx = bot - viewH;
    var maxScroll = Math.max(0, $list.scrollHeight - viewH);
    if (S.scrollPx > maxScroll)    S.scrollPx = maxScroll;
    if (S.scrollPx < 0)            S.scrollPx = 0;

    // Cursor tracks the row's true position and height.
    $list.style.transform   = "translateY(" + (-S.scrollPx) + "px)";
    $cursor.style.transform = "translateY(" + (top - S.scrollPx) + "px)";
    $cursor.style.height    = sel.offsetHeight + "px";
    $cursor.style.display   = "block";
  }

  var cur = S.elements[S.index];
  if (cur && cur.desc) {
    $desc.textContent = cur.desc;
    $desc.classList.remove("empty");
  } else {
    $desc.classList.add("empty");
  }

  $count.textContent = S.elements.length ? (S.index + 1) + " / " + S.elements.length : "";
}

function setPath(path) {
  if (!path || !path.length) return;
  var out = '<span class="root">' + esc(path[0]) + "</span>";
  for (var i = 1; i < path.length; i++) {
    out += '<span class="sep">&#8250;</span>' + esc(path[i]);
  }
  $path.innerHTML = out;
}

function setTabs(cats, idx) {
  if (!cats || !cats.length) { $tabs.classList.remove("on"); return; }
  var html = "";
  for (var i = 0; i < cats.length; i++) {
    html += '<div class="tab' + (i === idx ? " sel" : "") + '">' + esc(cats[i]) + "</div>";
  }
  $tabs.innerHTML = html;
  $tabs.classList.add("on");
}

function uptime() {
  var s = Math.floor((Date.now() - S.bootedAt) / 1000);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h";
}
function tickFoot() {
  $meta.textContent = "|  v" + S.version + "  |  " + uptime();
  $keys.textContent = S.keys;
}
setInterval(tickFoot, 1000);

/* ---------- toasts ---------- */
function toast(type, title, desc, duration) {
  var box = document.getElementById("toasts");
  var n = document.createElement("div");
  n.className = "toast " + (type || "info");
  n.innerHTML = '<div class="t">' + esc(title) + "</div>" +
                (desc ? '<div class="d">' + esc(desc) + "</div>" : "");
  box.appendChild(n);
  setTimeout(function () {
    n.classList.add("out");
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 260);
  }, duration || 3200);
}

/* ---------- message pump from Lua ---------- */
window.addEventListener("message", function (ev) {
  var d = ev.data;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch (e) { return; } }
  if (!d || !d.action) return;

  switch (d.action) {
    case "showUI":
      if (d.visible) {
        if (d.elements) { S.elements = d.elements; S.scrollPx = 0; buildRows(); }
        if (d.index !== undefined) S.index = d.index;
        if (d.path) setPath(d.path);
        setTabs(d.categories, d.categoryIndex || 0);
        if (d.version) S.version = d.version;
        if (d.keys) S.keys = d.keys;
        if (d.title) $wm.textContent = d.title;
        if (d.banner !== undefined) applyBanner(d.banner);
        if (d.maxVisible) S.maxVisible = d.maxVisible;
        tickFoot();
        paint();
        $panel.classList.add("on");
      } else {
        $panel.classList.remove("on");
      }
      break;

    case "updateElements":
      S.elements = d.elements || [];
      if (d.index !== undefined) S.index = d.index;
      if (d.resetScroll) S.scrollPx = 0;
      if (d.path) setPath(d.path);
      setTabs(d.categories, d.categoryIndex || 0);
      buildRows();
      paint();
      break;

    case "setIndex":
      S.index = d.index || 0;
      paint();
      break;

    case "setBanner":
      applyBanner(d.banner);
      break;

    case "freecam":
      fcShow(d.visible);
      if (!d.visible) { setTalkers([]); if ($fccross) $fccross.style.background = "#fff"; }
      break;

    case "fcCrosshair":
      if ($fccross) {
        $fccross.style.background = d.red ? "#ff3b3b" : "#fff";
        $fccross.style.boxShadow = d.red
          ? "0 0 0 1px rgba(0,0,0,.85), 0 0 6px rgba(255,59,59,.9)"
          : "0 0 0 1px rgba(0,0,0,.85)";
      }
      break;

    case "freecamOptions":
      fcOptions(d.options, d.index || 0);
      break;

    case "talkers":
      setTalkers(d.names);
      break;

    case "binds":
      setBinds(d.list, d.visible);
      break;

    case "esp":
      drawEsp(d.players, d.flags || {});
      break;

    case "aim":
      drawAim(d);
      break;

    case "serverstats":
      setServerStats(d);
      break;

    case "spectators":
      setSpectators(d.list);
      break;

    case "health":
      setHealth(d);
      break;

    case "loader":
      $lfill.style.width = (d.pct || 0) + "%";
      $ltext.textContent = d.text || "";
      break;

    case "loaderHide":
      $loader.classList.add("off");
      break;

    case "showNotification":
      toast(d.type, d.title, d.desc, d.duration);
      break;

    case "setPosition":
      $panel.style.left = d.x + "%";
      $panel.style.top  = d.y + "%";
      break;
  }
});

tickFoot();
</script>
</body>
</html>
