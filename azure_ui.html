<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Azure UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent:      #0084ff;
  --accent-lit:  #6ec8ff;
  --accent-deep: #0048a0;
  --ink:         #e7edf5;
  --ink-dim:     #8491a5;
  --row-h:       44px;
  --panel-w:     420px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  cursor: default;
}

/* ============================ PANEL ============================ */

#panel {
  position: absolute;
  left: 7%; top: 10%;
  width: var(--panel-w);
  border-radius: 10px;
  overflow: hidden;
  /* Flat transparency only. No backdrop-filter (CEF renders it as a black
     box) and no glow - just a see-through dark tint like a real menu. */
  background: rgba(6, 9, 14, 0.55);
  border: 1px solid rgba(0, 132, 255, 0.30);
  opacity: 0;
  transform: translateY(-10px) scale(0.985);
  transition: opacity .18s ease, transform .18s cubic-bezier(.2,.8,.25,1);
  pointer-events: none;
}
#panel.on { opacity: 1; transform: none; }

/* ============================ BANNER =========================== */

#banner {
  position: relative;
  height: 104px;
  overflow: hidden;
  background: #0a0d14 center / cover no-repeat;   /* image set by JS */
}

/* Wordmark shown only when there is no banner image. Flat, no glow. */
#wordmark {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 10px;
  text-indent: 10px;
  color: #fff;
}
#banner.has-img #wordmark { display: none; }

/* thin flat accent line under the banner */
#banner .edge {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: var(--accent);
}

/* ============================ CRUMB ============================ */

#crumb {
  display: flex; align-items: center;
  height: 34px; padding: 0 14px;
  background: rgba(3, 5, 9, .85);
  border-bottom: 1px solid rgba(0,132,255,.14);
  font-size: 12px;
}
#path { color: var(--ink); letter-spacing: .3px; }
#path .sep { color: var(--ink-dim); margin: 0 6px; }
#path .root { color: var(--ink-dim); }
#count { margin-left: auto; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

/* ============================ TABS ============================= */

#tabs { display: none; gap: 6px; padding: 8px 12px 2px; }
#tabs.on { display: flex; }
#tabs .tab {
  flex: 1; text-align: center;
  padding: 6px 0;
  font-size: 11px; letter-spacing: .4px; text-transform: uppercase;
  color: var(--ink-dim);
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 5px;
  transition: all .15s ease;
}
#tabs .tab.sel {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
}

/* ============================ LIST ============================= */

#viewport {
  position: relative;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
}

/* sliding selection block - flat solid accent, no glow */
#cursor {
  position: absolute; left: 0; right: 0;
  height: var(--row-h);
  background: var(--accent);
  transition: transform .14s ease;
  will-change: transform;
}

#list { transition: transform .16s cubic-bezier(.2,.9,.25,1); }

.row {
  position: relative;
  display: flex; align-items: center;
  height: var(--row-h);
  padding: 0 14px;
  font-size: 14px;
  color: var(--ink);
  border-bottom: 1px solid rgba(255,255,255,.025);
  animation: rowIn .22s ease backwards;
}
@keyframes rowIn { from { opacity: 0; transform: translateX(-10px); } }

.row.sel   { color: #fff; font-weight: 600; }
.row.dim   { color: #5d6577; }
.row.divider {
  height: 26px; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--ink-dim); background: rgba(255,255,255,.02);
  border-bottom: 1px solid rgba(0,132,255,.12);
}

.row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val   { color: var(--ink-dim); font-size: 13px; margin-left: 10px; }
.row.sel .val { color: rgba(255,255,255,.92); }
.row .val .arw { opacity: .45; padding: 0 4px; }
.row .chev  { color: #55637a; font-size: 15px; }
.row.sel .chev { color: #fff; }

/* toggle pill */
.pill {
  width: 34px; height: 17px; border-radius: 9px;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.10);
  position: relative;
  transition: all .18s ease;
}
.pill i {
  position: absolute; top: 2px; left: 2px;
  width: 11px; height: 11px; border-radius: 50%;
  background: #7d8899;
  transition: all .18s cubic-bezier(.2,.9,.25,1);
}
.pill.on {
  background: rgba(0,132,255,.45);
  border-color: rgba(120,205,255,.65);
}
.pill.on i { left: 18px; background: var(--accent-lit); }
.row.sel .pill.on { background: rgba(255,255,255,.28); }
.row.sel .pill.on i { background: #fff; }

/* ============================ DESC + FOOT ====================== */

#desc {
  padding: 9px 14px;
  font-size: 11.5px; line-height: 1.35;
  color: var(--ink-dim);
  background: rgba(3,5,9,.72);
  border-top: 1px solid rgba(0,132,255,.14);
  border-left: 3px solid var(--accent-deep);
  min-height: 32px;
}
#desc.empty { display: none; }

#foot {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px; height: 30px;
  background: rgba(2,4,8,.92);
  border-top: 1px solid rgba(0,132,255,.22);
  font-size: 10.5px; color: var(--ink-dim); letter-spacing: .4px;
}
#foot .mark {
  font-weight: 800; font-size: 13px; color: var(--accent-lit);
}
#foot .keys { margin-left: auto; color: var(--accent-lit); }

/* bind chip on a feature row */
.row .bindchip {
  margin-left: 8px; padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 600; letter-spacing: .3px;
  color: var(--accent-lit);
  background: rgba(0,132,255,.14);
  border: 1px solid rgba(0,132,255,.4);
}
.row.sel .bindchip { color: #fff; border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.18); }
.row .bindchip.listening {
  color: #fff; background: var(--accent); border-color: var(--accent);
  animation: talkpulse .8s ease-in-out infinite;
}

/* ==================== ACTIVE KEYBINDS (top-right) ============= */

#binds {
  position: absolute; left: 24px; top: 24px;
  width: 190px; border-radius: 8px; overflow: hidden;
  background: rgba(6,9,14,.82);
  border: 1px solid rgba(0,132,255,.28);
  font-size: 12px;
}
#binds.empty { display: none; }
#binds .head {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  background: rgba(0,132,255,.16);
  color: #fff; font-weight: 700; font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
}
#binds .brow {
  display: flex; align-items: center;
  padding: 6px 11px;
  border-top: 1px solid rgba(255,255,255,.05);
  color: var(--ink);
}
#binds .brow .k {
  margin-left: auto; color: var(--ink-dim); font-weight: 600;
}
#binds .brow .st { margin-left: 8px; font-size: 10px; font-weight: 700; }
#binds .brow .st.on  { color: #29d18c; }
#binds .brow .st.off { color: #ff6470; }

/* ============================ ESP ============================= */

#esp {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ============================ FREECAM ========================= */

#freecam { position: fixed; inset: 0; pointer-events: none; }
#freecam.off { display: none; }

/* simple white dot crosshair */
#fc-crosshair {
  position: absolute; left: 50%; top: 50%;
  width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.85);
}

/* centered feature scroller (plain white text, no outline, like the ref) */
.FCWrapper {
  position: absolute;
  left: 50%; bottom: 40vh;
  transform: translateX(-50%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  gap: 9px;
  font-family: "Inter", sans-serif;
}
.FCWrapper .Option {
  font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.32);
  letter-spacing: .2px;
  transition: color .12s ease;
}
.FCWrapper .Option.Selected {
  color: #fff;
  font-weight: 600;
}

/* talk indicator (top-center, clear of the keybinds panel) */
#talkers {
  position: absolute; left: 50%; top: 24px; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.talker {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 7px;
  background: rgba(9,12,19,.9);
  border-left: 3px solid var(--accent);
  font-size: 12px; color: var(--ink);
  animation: toastIn .2s ease;
}
.talker.near { border-left-color: #29d18c; }
.talker .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-lit); flex: none;
  animation: talkpulse 1s ease-in-out infinite;
}
.talker.near .dot { background: #29d18c; }
@keyframes talkpulse { 50% { opacity: .35; } }

/* ============================ LOADER ========================== */

#loader {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(60% 60% at 50% 45%, rgba(10,16,26,.96), rgba(3,5,9,.99));
  z-index: 999;
  transition: opacity .4s ease;
}
#loader.off { opacity: 0; pointer-events: none; }
#loader .lwrap { width: 340px; text-align: center; }
#loader .lmark {
  font-size: 40px; font-weight: 800; letter-spacing: 12px; text-indent: 12px;
  color: #fff; margin-bottom: 22px;
}
#loader .lbar {
  height: 4px; border-radius: 3px; overflow: hidden;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(0,132,255,.25);
}
#loader #lfill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent-lit));
  transition: width .25s ease;
}
#loader #ltext {
  margin-top: 14px; font-size: 12px; color: var(--ink-dim); letter-spacing: .4px;
  min-height: 16px;
}

/* ============================ TOASTS =========================== */

#toasts {
  position: absolute; top: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 8px;
  width: 300px;
}
.toast {
  padding: 11px 14px;
  border-radius: 8px;
  background: rgba(9,12,19,.96);
  border: 1px solid rgba(255,255,255,.06);
  border-left: 3px solid var(--accent);
  animation: toastIn .25s cubic-bezier(.2,.9,.25,1);
}
.toast.out { animation: toastOut .25s ease forwards; }
.toast.error   { border-left-color: #ff4d5e; }
.toast.success { border-left-color: #29d18c; }
.toast .t { font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .4px; }
.toast .d { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }
@keyframes toastIn  { from { opacity: 0; transform: translateX(40px); } }
@keyframes toastOut { to   { opacity: 0; transform: translateX(40px); } }
</style>
</head>
<body>

<canvas id="esp"></canvas>

<div id="loader">
  <div class="lwrap">
    <div class="lmark">AZURE</div>
    <div class="lbar"><div id="lfill"></div></div>
    <div id="ltext">Loading...</div>
  </div>
</div>

<div id="binds" class="empty"></div>

<div id="panel">
  <div id="banner">
    <div id="wordmark">AZURE</div>
    <div class="edge"></div>
  </div>

  <div id="crumb">
    <div id="path"></div>
    <div id="count"></div>
  </div>

  <div id="tabs"></div>

  <div id="viewport">
    <div id="cursor"></div>
    <div id="list"></div>
  </div>

  <div id="desc" class="empty"></div>

  <div id="foot">
    <span class="mark">A</span>
    <span id="meta"></span>
    <span class="keys" id="keys"></span>
  </div>
</div>

<div id="toasts"></div>

<div id="freecam" class="off">
  <div id="fc-crosshair"></div>
  <div id="fc-options" class="FCWrapper"></div>
</div>

<div id="talkers"></div>

<script>
var ROW = 44;

var S = {
  elements: [],
  index: 0,
  scrollPx: 0,
  maxVisible: 10,
  version: "1.0.0",
  keys: "F5 / F7",
  bootedAt: Date.now()
};

var $panel  = document.getElementById("panel");
var $list   = document.getElementById("list");
var $cursor = document.getElementById("cursor");
var $view   = document.getElementById("viewport");
var $path   = document.getElementById("path");
var $count  = document.getElementById("count");
var $desc   = document.getElementById("desc");
var $tabs   = document.getElementById("tabs");
var $meta   = document.getElementById("meta");
var $keys   = document.getElementById("keys");
var $wm     = document.getElementById("wordmark");
var $banner = document.getElementById("banner");
var $freecam = document.getElementById("freecam");
var $fcopts  = document.getElementById("fc-options");
var $talkers = document.getElementById("talkers");
var $binds   = document.getElementById("binds");
var $esp     = document.getElementById("esp");
var ectx     = $esp.getContext("2d");
var $loader  = document.getElementById("loader");
var $lfill   = document.getElementById("lfill");
var $ltext   = document.getElementById("ltext");

function sizeEsp() { $esp.width = window.innerWidth; $esp.height = window.innerHeight; }
window.addEventListener("resize", sizeEsp);
sizeEsp();

/* ---------- active keybinds panel (top-right) ---------- */
function setBinds(list, visible) {
  if (visible === false || !list || !list.length) { $binds.classList.add("empty"); $binds.innerHTML = ""; return; }
  var h = '<div class="head">Keybinds</div>';
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var st = "";
    if (b.state) st = '<span class="st ' + (b.state === "ON" ? "on" : "off") + '">' + b.state + "</span>";
    h += '<div class="brow"><span>' + esc(b.label) + '</span>' +
         '<span class="k">' + esc(b.key) + "</span>" + st + "</div>";
  }
  $binds.innerHTML = h;
  $binds.classList.remove("empty");
}

/* ---------- ESP canvas ---------- */
function espText(t, x, y) {
  ectx.lineWidth = 3; ectx.strokeStyle = "rgba(0,0,0,.85)";
  ectx.strokeText(t, x, y);
  ectx.fillText(t, x, y);
}
function drawEsp(players, flags) {
  ectx.clearRect(0, 0, $esp.width, $esp.height);
  if (!players || !players.length) return;
  var W = $esp.width, H = $esp.height;
  ectx.textAlign = "center";

  for (var i = 0; i < players.length; i++) {
    var p  = players[i];
    var x  = p.x * W, y = p.y * H, w = p.w * W, h = p.h * H;
    var cx = p.fx * W, fy = p.fy * H;

    if (flags.lines) {
      ectx.strokeStyle = "rgba(0,132,255,.55)"; ectx.lineWidth = 1;
      ectx.beginPath(); ectx.moveTo(W / 2, H); ectx.lineTo(cx, fy); ectx.stroke();
    }
    if (flags.skeleton && p.bones) {
      ectx.strokeStyle = "rgba(255,255,255,.85)"; ectx.lineWidth = 1.3;
      for (var b = 0; b < p.bones.length; b++) {
        var s = p.bones[b];
        ectx.beginPath(); ectx.moveTo(s[0] * W, s[1] * H); ectx.lineTo(s[2] * W, s[3] * H); ectx.stroke();
      }
    }
    if (flags.box) {
      ectx.lineWidth = 3; ectx.strokeStyle = "rgba(0,0,0,.6)"; ectx.strokeRect(x, y, w, h);
      ectx.lineWidth = 1.4; ectx.strokeStyle = "#0084ff"; ectx.strokeRect(x, y, w, h);
    }
    if (flags.names) {
      ectx.font = "600 12px Inter, sans-serif"; ectx.fillStyle = "#fff";
      espText(p.name, cx, y - 5);
    }
    if (flags.distance) {
      ectx.font = "11px Inter, sans-serif"; ectx.fillStyle = "rgba(180,212,255,.95)";
      espText(p.dist + "m", cx, fy + 13);
    }
  }
}

function fcShow(on)   { $freecam.classList.toggle("off", !on); }
function fcOptions(list, idx) {
  var h = "";
  for (var i = 0; i < (list || []).length; i++) {
    h += '<div class="Option' + (i === idx ? " Selected" : "") + '">' + esc(list[i]) + "</div>";
  }
  $fcopts.innerHTML = h;
}
function setTalkers(list) {
  if (!list || !list.length) { $talkers.innerHTML = ""; return; }
  var h = "";
  for (var i = 0; i < list.length; i++) {
    var t = list[i];
    var name = (t && t.name !== undefined) ? t.name : t;
    var near = t && t.near;
    var tail = near ? " (near you)" : "";
    h += '<div class="talker' + (near ? " near" : "") + '"><span class="dot"></span>' +
         esc(name) + " talking" + tail + "</div>";
  }
  $talkers.innerHTML = h;
}

function applyBanner(url) {
  if (url && url.length) {
    $banner.style.backgroundImage = "url('" + url.replace(/'/g, "%27") + "')";
    $banner.classList.add("has-img");
  } else {
    $banner.style.backgroundImage = "";
    $banner.classList.remove("has-img");
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ---------- value rendering per item type ---------- */
function rightSide(el) {
  var t = el.type;
  if (t === "checkbox" || t === "toggle") {
    return '<div class="pill' + (el.checked ? " on" : "") + '"><i></i></div>';
  }
  if (t === "subMenu" || t === "submenu") {
    return '<div class="chev">&#8250;</div>';
  }
  if (el.value !== undefined && el.value !== null && el.value !== "") {
    if (t === "list" || t === "scrollable" || t === "slider") {
      return '<div class="val"><span class="arw">&#8249;</span>' + esc(el.value) +
             '<span class="arw">&#8250;</span></div>';
    }
    return '<div class="val">' + esc(el.value) + "</div>";
  }
  return "";
}

function buildRows() {
  var html = "";
  for (var i = 0; i < S.elements.length; i++) {
    var el = S.elements[i];
    if (el.type === "divider") {
      html += '<div class="row divider" style="animation-delay:' + (i * 12) + 'ms">' +
              '<div class="label">' + esc(el.label) + "</div></div>";
      continue;
    }
    var cls = "row" + (el.disabled || el.type === "label" ? " dim" : "");
    var bind = "";
    if (el.binding)   bind = '<span class="bindchip listening">press key</span>';
    else if (el.bind) bind = '<span class="bindchip">' + esc(el.bind) + "</span>";
    html += '<div class="' + cls + '" style="animation-delay:' + (i * 12) + 'ms">' +
            '<div class="label">' + esc(el.label) + "</div>" +
            bind + rightSide(el) + "</div>";
  }
  $list.innerHTML = html;

  // Viewport height = actual height of the first N rows (dividers are shorter
  // than options, so counting rows x ROW would be wrong).
  var n = Math.min(S.elements.length || 1, S.maxVisible);
  var h = 0;
  for (var k = 0; k < n && k < $list.children.length; k++) {
    h += $list.children[k].offsetHeight;
  }
  $view.style.height = (h || ROW) + "px";
}

function paint() {
  var rows = $list.children;
  for (var i = 0; i < rows.length; i++) {
    if (i === S.index) rows[i].classList.add("sel");
    else rows[i].classList.remove("sel");
  }

  var sel = rows[S.index];
  if (!sel) { $cursor.style.display = "none"; }
  else {
    // Scroll (in real pixels) so the selected row stays inside the viewport.
    var viewH = $view.clientHeight;
    var top   = sel.offsetTop;
    var bot   = top + sel.offsetHeight;
    if (top < S.scrollPx)          S.scrollPx = top;
    if (bot > S.scrollPx + viewH)  S.scrollPx = bot - viewH;
    var maxScroll = Math.max(0, $list.scrollHeight - viewH);
    if (S.scrollPx > maxScroll)    S.scrollPx = maxScroll;
    if (S.scrollPx < 0)            S.scrollPx = 0;

    // Cursor tracks the row's true position and height.
    $list.style.transform   = "translateY(" + (-S.scrollPx) + "px)";
    $cursor.style.transform = "translateY(" + (top - S.scrollPx) + "px)";
    $cursor.style.height    = sel.offsetHeight + "px";
    $cursor.style.display   = "block";
  }

  var cur = S.elements[S.index];
  if (cur && cur.desc) {
    $desc.textContent = cur.desc;
    $desc.classList.remove("empty");
  } else {
    $desc.classList.add("empty");
  }

  $count.textContent = S.elements.length ? (S.index + 1) + " / " + S.elements.length : "";
}

function setPath(path) {
  if (!path || !path.length) return;
  var out = '<span class="root">' + esc(path[0]) + "</span>";
  for (var i = 1; i < path.length; i++) {
    out += '<span class="sep">&#8250;</span>' + esc(path[i]);
  }
  $path.innerHTML = out;
}

function setTabs(cats, idx) {
  if (!cats || !cats.length) { $tabs.classList.remove("on"); return; }
  var html = "";
  for (var i = 0; i < cats.length; i++) {
    html += '<div class="tab' + (i === idx ? " sel" : "") + '">' + esc(cats[i]) + "</div>";
  }
  $tabs.innerHTML = html;
  $tabs.classList.add("on");
}

function uptime() {
  var s = Math.floor((Date.now() - S.bootedAt) / 1000);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h";
}
function tickFoot() {
  $meta.textContent = "|  v" + S.version + "  |  " + uptime();
  $keys.textContent = S.keys;
}
setInterval(tickFoot, 1000);

/* ---------- toasts ---------- */
function toast(type, title, desc, duration) {
  var box = document.getElementById("toasts");
  var n = document.createElement("div");
  n.className = "toast " + (type || "info");
  n.innerHTML = '<div class="t">' + esc(title) + "</div>" +
                (desc ? '<div class="d">' + esc(desc) + "</div>" : "");
  box.appendChild(n);
  setTimeout(function () {
    n.classList.add("out");
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 260);
  }, duration || 3200);
}

/* ---------- message pump from Lua ---------- */
window.addEventListener("message", function (ev) {
  var d = ev.data;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch (e) { return; } }
  if (!d || !d.action) return;

  switch (d.action) {
    case "showUI":
      if (d.visible) {
        if (d.elements) { S.elements = d.elements; S.scrollPx = 0; buildRows(); }
        if (d.index !== undefined) S.index = d.index;
        if (d.path) setPath(d.path);
        setTabs(d.categories, d.categoryIndex || 0);
        if (d.version) S.version = d.version;
        if (d.keys) S.keys = d.keys;
        if (d.title) $wm.textContent = d.title;
        if (d.banner !== undefined) applyBanner(d.banner);
        if (d.maxVisible) S.maxVisible = d.maxVisible;
        tickFoot();
        paint();
        $panel.classList.add("on");
      } else {
        $panel.classList.remove("on");
      }
      break;

    case "updateElements":
      S.elements = d.elements || [];
      if (d.index !== undefined) S.index = d.index;
      if (d.resetScroll) S.scrollPx = 0;
      if (d.path) setPath(d.path);
      setTabs(d.categories, d.categoryIndex || 0);
      buildRows();
      paint();
      break;

    case "setIndex":
      S.index = d.index || 0;
      paint();
      break;

    case "setBanner":
      applyBanner(d.banner);
      break;

    case "freecam":
      fcShow(d.visible);
      if (!d.visible) setTalkers([]);
      break;

    case "freecamOptions":
      fcOptions(d.options, d.index || 0);
      break;

    case "talkers":
      setTalkers(d.names);
      break;

    case "binds":
      setBinds(d.list, d.visible);
      break;

    case "esp":
      drawEsp(d.players, d.flags || {});
      break;

    case "loader":
      $lfill.style.width = (d.pct || 0) + "%";
      $ltext.textContent = d.text || "";
      break;

    case "loaderHide":
      $loader.classList.add("off");
      break;

    case "showNotification":
      toast(d.type, d.title, d.desc, d.duration);
      break;

    case "setPosition":
      $panel.style.left = d.x + "%";
      $panel.style.top  = d.y + "%";
      break;
  }
});

tickFoot();
</script>
</body>
</html>
